<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiketGo - Redirect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
        }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Kontainer Utama -->
    <div class="max-w-md w-full text-center">
        <!-- Logo / Icon -->
        <div class="mb-8">
            <div class="w-20 h-20 bg-blue-600 rounded-2xl shadow-xl shadow-blue-200 flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-ticket-alt text-white text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">TiketGo</h1>
            <p class="text-gray-500">Temukan tiket event impianmu di sini.</p>
        </div>

        <!-- Kartu Link -->
        <div class="space-y-4">
            <!-- Link Utama -->
            <a href="https://nama-web-tujuan-anda.com" target="_blank" class="flex items-center justify-between p-4 bg-white border border-gray-100 rounded-2xl shadow-sm hover:shadow-md hover:border-blue-300 transition-all group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition">
                        <i class="fas fa-shopping-cart"></i>
                    </div>
                    <div class="text-left">
                        <span class="block font-semibold text-gray-800">Beli Tiket Sekarang</span>
                        <span class="text-xs text-gray-400">Menuju website penjualan resmi</span>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-300 group-hover:text-blue-500 transition"></i>
            </a>

            <!-- Link Alternatif (Opsional) -->
            <a href="https://wa.me/nomor-anda" target="_blank" class="flex items-center justify-between p-4 bg-white border border-gray-100 rounded-2xl shadow-sm hover:shadow-md hover:border-green-300 transition-all group">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-green-50 text-green-600 rounded-full flex items-center justify-center group-hover:bg-green-600 group-hover:text-white transition">
                        <i class="fab fa-whatsapp"></i>
                    </div>
                    <div class="text-left">
                        <span class="block font-semibold text-gray-800">Hubungi CS</span>
                        <span class="text-xs text-gray-400">Bantuan pembelian via WhatsApp</span>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-300 group-hover:text-green-500 transition"></i>
            </a>
        </div>

        <!-- Footer Sederhana -->
        <div class="mt-12">
            <p class="text-sm text-gray-400">&copy; 2026 TiketGo. All rights reserved.</p>
            <div class="flex justify-center gap-4 mt-4 opacity-50">
                <a href="#" class="text-gray-600 hover:text-blue-600"><i class="fab fa-instagram"></i></a>
                <a href="#" class="text-gray-600 hover:text-blue-600"><i class="fab fa-facebook"></i></a>
            </div>
        </div>
    </div>

</body>
</html>
